<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Demo menu VAXORA Care (dữ liệu giả)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--t:#04959B;--tb:#02B4BB;--td:#067A84;--navy:#022383;--ink:#0B2A3E;--mut:#455768;--tint:#E3F5F6;--or:#EF7422;--bg:#F3F5F7;--line:#E0E5EB;--warn:#A85A00;
 /* thang chữ: tiêu đề trang > tên khách > nội dung > phụ > nhãn */
 --f-title:20px;--f-name:15px;--f-body:14px;--f-meta:13px;--f-label:11.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:clip;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#DDE5EA;font-size:var(--f-body);text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--td);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
#frame{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:clip}
@media(min-width:700px){body{padding:18px 0}#frame{height:min(880px,calc(100dvh - 36px));border-radius:34px;border:8px solid #0b1620;box-shadow:0 20px 50px rgba(2,35,131,.25)}}
/* thanh tuỳ chọn demo */
#demobar{flex:none;background:#0b1620;color:#fff;font-size:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:36px;padding-top:max(6px,env(safe-area-inset-top))}
#demobar b{font-weight:700}#demobar .sp{flex:1}
#demobar button{background:rgba(255,255,255,.14);border:0;border-radius:99px;color:#fff;padding:6px 12px;font-size:12px;font-weight:600;min-height:30px;display:flex;gap:6px;align-items:center}
#opts{display:none;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);flex:none;gap:12px;flex-direction:column}
#opts.on{display:flex}#opts .g{display:flex;flex-direction:column;gap:6px}#opts label.t{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--mut)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--mut);min-height:36px}.chipsel button.on{background:var(--td);border-color:var(--td);color:#fff}
/* đầu trang */
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:60px}
.hd.teal{background:var(--t);border-bottom:0}
.hd .logo{height:38px;width:auto;display:block}
.hd .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none;color:var(--ink)}
.hd.teal .ib{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32);color:#fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;border:0}
.hd.teal .av{background:#fff;color:var(--navy)}
.hamb{display:none}
#body{flex:1;min-height:0;display:flex}
/* thanh trái (rail): rộng 72, biểu tượng 24, nhãn 11.5 */
#rail{display:none;width:72px;flex:none;background:#fff;border-right:1px solid var(--line);flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.ri{width:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 4px;font-size:var(--f-label);font-weight:600;color:var(--mut);line-height:1.2;min-height:56px}
.ri .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:24px;transition:background .15s}
.ri.on{color:var(--td)}.ri.on .ic{background:var(--tint);color:var(--td)}.ri.end{margin-top:auto}
@media(hover:hover){.ri:hover .ic{background:#EEF2F5}.ri.on:hover .ic{background:var(--tint)}}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#pills{display:none;flex:none;gap:6px;padding:8px 14px 10px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:10px 14px;border-radius:99px;font-size:var(--f-meta);font-weight:600;background:#fff;border:1px solid var(--line);color:var(--mut);min-height:40px}
.pill.on{background:var(--td);border-color:var(--td);color:#fff}
#scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.sticky{position:sticky;top:-12px;z-index:2;background:var(--bg);padding:12px 0 6px;margin:-12px 0 -6px}
/* thanh dưới (kiểu B) */
#tabs{display:none;flex:none;margin:0 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(2,35,131,.14);padding:5px}
.tab{flex:1;border:0;background:none;border-radius:17px;padding:6px 0;min-height:54px;font-size:var(--f-label);font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ic{font-size:22px;display:grid;place-items:center}.tab.on{background:var(--tint);color:var(--td)}
body[data-menu="A"] #pills{display:flex}
body[data-menu="B"] #tabs{display:flex}
body[data-menu="C1"] #rail{display:flex}
body[data-menu="C2"] .hamb{display:grid}
/* nội dung: tiêu đề > tên > nội dung > phụ */
.hello h2{margin:0;font-size:var(--f-title);line-height:1.25;letter-spacing:-.2px;font-weight:700}.hello h2 b{color:var(--td);font-weight:800}
.hello p{margin:3px 0 0;color:var(--mut);font-size:var(--f-meta)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 2px;font-size:var(--f-meta);font-weight:600;color:var(--mut);min-height:40px}.seg button.on{background:var(--td);color:#fff}
.fc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:9px;box-shadow:0 4px 16px rgba(2,35,131,.06)}
.fh{display:flex;gap:10px;align-items:center}.k{width:40px;height:40px;border-radius:12px;background:var(--td);color:#fff;font-weight:700;display:grid;place-items:center;font-size:var(--f-meta);flex:none}
.fh b{font-size:var(--f-name);font-weight:600;line-height:1.25;display:block}.fh small{display:block;color:var(--mut);font-size:var(--f-meta);margin-top:1px}
.tg{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:#FDEBD8;color:var(--warn);display:inline-flex;gap:4px;align-items:center}.tag.b{background:var(--tint);color:var(--navy)}.tag .i{font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chips span{font-size:var(--f-meta);font-weight:500;padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--line)}.chips em{font-style:normal;font-size:var(--f-meta);color:var(--mut);font-weight:600}
.btns{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.btn{min-height:44px;border-radius:12px;border:0;font-weight:600;font-size:var(--f-body);display:flex;gap:7px;align-items:center;justify-content:center}.btn .i{font-size:18px}
.b1{background:var(--td);color:#fff}.b2{background:var(--tint);color:var(--navy)}.b3{grid-column:1/3;border:1.5px solid var(--td);color:var(--td);background:#fff}
.c2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:56px}
.c2 .k{width:36px;height:36px;font-size:12px;border-radius:10px}.c2 b{font-size:var(--f-name);font-weight:600;display:block}.c2 small{display:block;color:var(--mut);font-size:var(--f-meta)}
.c2 .go{margin-left:auto;background:var(--td);color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}
.lab{font-size:var(--f-label);font-weight:700;letter-spacing:.6px;color:var(--mut);margin:4px 0 -2px;text-transform:uppercase}
.search{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.st small{color:var(--mut);font-size:var(--f-meta)}.st div{font-size:24px;font-weight:700;margin-top:2px;color:var(--navy)}
.prof{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}.prof .av{width:52px;height:52px;font-size:16px}
#scrim{position:absolute;inset:0;background:rgba(6,24,36,.5);z-index:20;display:none}#scrim.on{display:block}
#drawer{position:absolute;left:0;top:0;bottom:0;width:276px;max-width:84%;background:#fff;z-index:21;transform:translateX(-102%);transition:transform .22s ease-out;padding:max(14px,env(safe-area-inset-top)) 12px 14px;display:flex;flex-direction:column;gap:2px}
#drawer.on{transform:none;box-shadow:8px 0 30px rgba(2,35,131,.25)}
#drawer .logo{height:42px;width:auto;margin:4px 4px 12px;align-self:flex-start}
.dg{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--mut);margin:12px 12px 4px}
.dr{border:0;background:none;text-align:left;padding:12px;border-radius:12px;font-size:var(--f-name);font-weight:600;color:var(--mut);display:flex;gap:12px;align-items:center;min-height:48px;width:100%}
.dr .i{font-size:20px}.dr.on{background:var(--td);color:#fff}.dr em{margin-left:auto;font-style:normal;background:var(--or);color:var(--navy);font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);font-size:var(--f-meta)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;z-index:21;border-radius:24px 24px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(104%);transition:transform .22s ease-out}
#sheet.on{transform:none;box-shadow:0 -10px 40px rgba(2,35,131,.25)}#sheet h3{margin:2px 4px 8px;font-size:17px}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);background:#0b1620;color:#fff;padding:10px 16px;border-radius:99px;font-size:var(--f-meta);font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){#drawer,#sheet,#toast,.ri .ic{transition:none}}
</style></head>

 </div>
 <header class="hd teal" id="hd">
  <button class="ib hamb" id="hamb" aria-label="Mở menu"><span data-i="menu"></span></button>

 </header>
 <div id="body">
  <nav id="rail" aria-label="Menu"></nav>

  </div>
 </div>

</div>

function ico(n,extra){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||"")+"</svg>"}
function fillIcons(root){[].forEach.call((root||document).querySelectorAll("[data-i]"),function(e){e.outerHTML=ico(e.getAttribute("data-i"))})}
var NAV=[["today","Hôm nay","house"],["data","Data","list"],["hist","Lịch sử","history"],["kpi","KPI","chart-column"],["acc","Tài khoản","user"]];
var S={page:"today",seg:0,menu:"C1",head:"teal",logo:"orig"};
var $=function(s){return document.querySelector(s)};
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1800)}
function logoSrc(){return S.head==="teal"?(S.logo==="equal"?IMG.we:IMG.wo):(S.logo==="equal"?IMG.be:IMG.bo)}
function blueLogo(){return S.logo==="equal"?IMG.be:IMG.bo}
function applyLook(){document.body.dataset.menu=S.menu;$("#hd").className="hd"+(S.head==="teal"?" teal":"");$("#logo").src=logoSrc();renderNav()}
function drawerHtml(){var d=function(p,l,i,badge){return '<button class="dr'+(S.page===p?" on":"")+'" data-p="'+p+'">'+ico(i)+l+(badge?"<em>"+badge+"</em>":"")+"</button>"};
 return '<div class="dg">CÔNG VIỆC</div>'+d("today","Hôm nay","house",23)+d("data","Data được giao","list")+'<div class="dg">HIỆU QUẢ</div>'+d("hist","Lịch sử","history")+d("kpi","KPI","chart-column")+'<div class="dg">CÔNG CỤ</div><button class="dr" data-dict>'+ico("book-open")+'Từ điển vaccine</button><div class="dg">HỆ THỐNG</div>'+d("acc","Tài khoản","user")+'<div class="me"><span class="av">NA</span><div><b>Nhân viên A</b><br><span style="color:var(--mut)">Shop Phú Mỹ</span></div></div>'}
function renderNav(){
 $("#pills").innerHTML=NAV.map(function(n){return '<button class="pill'+(S.page===n[0]?" on":"")+'" data-p="'+n[0]+'">'+n[1]+"</button>"}).join("");
 $("#tabs").innerHTML=NAV.slice(0,4).map(function(n){return '<button class="tab'+(S.page===n[0]?" on":"")+'" data-p="'+n[0]+'"><span class="ic">'+ico(n[2])+"</span>"+n[1]+"</button>"}).join("")+'<button class="tab" data-more><span class="ic">'+ico("ellipsis")+"</span>Thêm</button>";
 $("#rail").innerHTML=NAV.slice(0,4).map(function(n){return '<button class="ri'+(S.page===n[0]?" on":"")+'" data-p="'+n[0]+'" aria-label="'+n[1]+'"><span class="ic">'+ico(n[2])+"</span>"+n[1]+"</button>"}).join("")+'<button class="ri end" data-more aria-label="Thêm"><span class="ic">'+ico("ellipsis")+"</span>Thêm</button>";
 $("#drawer").innerHTML='<img class="logo" alt="Tiêm chủng Long Châu" src="'+blueLogo()+'">'+drawerHtml();
 bindNav()}
function bindNav(){
 [].forEach.call(document.querySelectorAll("[data-p]"),function(b){b.onclick=function(){go(b.dataset.p)}});
 [].forEach.call(document.querySelectorAll("[data-more]"),function(b){b.onclick=function(){openSheet("more")}});
 [].forEach.call(document.querySelectorAll("[data-dict]"),function(b){b.onclick=function(){closeDrawer();openSheet("dict")}})}
function go(p){S.page=p;closeDrawer();closeSheet();renderNav();renderPage();$("#scroll").scrollTop=0}
function card(k,n,s){return '<button class="c2" data-call><span class="k">'+k+'</span><span><b>'+n+"</b><small>"+s+'</small></span><span class="go">'+ico("phone")+"</span></button>"}
function renderPage(){var h="",p=S.page;
 if(p==="today"){
  var segs=["Cần gọi 23","Hẹn lại 2","Đã xong 13"];
  h='<div class="hello"><h2>Hôm nay có <b>23</b> khách cần gọi</h2><p>Đã xong 0 / 25 · Thứ Năm 26/11</p></div>'+
  '<div class="sticky"><div class="seg">'+segs.map(function(s,i){return '<button data-seg="'+i+'" class="'+(S.seg===i?"on":"")+'">'+s+"</button>"}).join("")+"</div></div>"+
  '<div class="lab">Việc kế tiếp</div><div class="fc"><div class="fh"><span class="k">K9</span><div><b>Khách giả 96</b><small>19 tháng · 0900 000 096</small></div></div><div class="tg"><span class="tag">'+ico("triangle-alert")+'Trễ 9 ngày</span><span class="tag b">Lần 1/3</span></div><div class="chips"><span>6 trong 1</span><span>Phế cầu</span><em>+2</em></div><div class="btns"><button class="btn b1" data-call>'+ico("phone")+'Gọi</button><button class="btn b2" data-call>'+ico("message-circle")+'Nhắn</button><button class="btn b3" data-call>'+ico("clipboard-check")+'Ghi nhận kết quả</button></div></div>'+
  '<div class="lab">Còn lại</div>'+[["K1","Khách giả 102","2 tuổi · trễ 5 ngày"],["K7","Khách giả 138","21 tháng"],["K4","Khách giả 211","14 tháng · hẹn gọi lại"],["K8","Khách giả 215","3 tuổi"],["K2","Khách giả 230","9 tháng · giao hôm qua"],["K6","Khách giả 244","5 tuổi"],["K3","Khách giả 251","27 tháng"],["K5","Khách giả 260","6 tuổi"]].map(function(c){return card(c[0],c[1],c[2])}).join("")}
 else if(p==="data"){h='<div class="hello"><h2>Data được giao</h2><p>38 khách · Shop Phú Mỹ</p></div><input class="search" placeholder="Tìm tên, số điện thoại…" aria-label="Tìm khách">'+[["K9","Khách giả 96","19 tháng · đang xử lý"],["K1","Khách giả 102","2 tuổi · chưa gọi"],["K7","Khách giả 138","21 tháng · lần 2/3"],["K4","Khách giả 211","14 tháng · hẹn lại"],["K8","Khách giả 215","3 tuổi · chưa gọi"],["K2","Khách giả 230","9 tháng · đã xong"]].map(function(c){return card(c[0],c[1],c[2])}).join("")}
 else if(p==="hist"){h='<div class="hello"><h2>Lịch sử xử lý</h2><p>50 hoạt động gần nhất</p></div>'+[["K3","Khách giả 251","Hẹn qua tiêm · 22 giờ trước"],["K6","Khách giả 244","Không nghe máy · 1 ngày trước"],["K5","Khách giả 260","Đã tiêm Long Châu · 2 ngày trước"],["K2","Khách giả 230","Từ chối · 2 ngày trước"]].map(function(c){return card(c[0],c[1],c[2])}).join("")}
 else if(p==="kpi"){h='<div class="hello"><h2>KPI</h2><p>Chỉ số tạm để xem</p></div><div class="stats"><div class="st"><small>Được giao</small><div>38</div></div><div class="st"><small>Hoàn thành</small><div>11</div></div><div class="st"><small>Hẹn / đã tiêm</small><div>6</div></div><div class="st"><small>Tỷ lệ hẹn</small><div>55%</div></div></div>'}
 else{h='<div class="hello"><h2>Tài khoản</h2></div><div class="prof"><span class="av">NA</span><div><b style="font-size:var(--f-name)">Nhân viên A (giả)</b><br><span style="color:var(--mut);font-size:var(--f-meta)">Nhân viên · Shop Phú Mỹ</span></div></div><button class="btn b3" style="width:100%;grid-column:auto" data-call>Đổi mã PIN</button><button class="btn b3" style="width:100%;grid-column:auto;color:#B3261E;border-color:#B3261E" data-call>Đăng xuất</button>'}
 $("#scroll").innerHTML=h;
 [].forEach.call(document.querySelectorAll("[data-call]"),function(b){b.onclick=function(e){e.stopPropagation();toast("Demo: chưa có thao tác thật")}});
 [].forEach.call(document.querySelectorAll("[data-seg]"),function(b){b.onclick=function(){S.seg=+b.dataset.seg;renderPage()}})}
function openDrawer(){$("#drawer").classList.add("on");$("#scrim").classList.add("on")}
function closeDrawer(){$("#drawer").classList.remove("on");if(!$("#sheet").classList.contains("on"))$("#scrim").classList.remove("on")}
function openSheet(w){var h=w==="dict"?'<h3>Từ điển vaccine</h3><p style="margin:4px;color:var(--mut)">Bản demo: cửa sổ tra cứu sẽ hiện ở đây.</p>':'<h3>Thêm</h3><button class="dr" data-p="acc">'+ico("user")+'Tài khoản</button><button class="dr" data-dict>'+ico("book-open")+'Từ điển vaccine</button>';
 $("#sheet").innerHTML=h;$("#sheet").classList.add("on");$("#scrim").classList.add("on");bindNav()}
function closeSheet(){$("#sheet").classList.remove("on");if(!$("#drawer").classList.contains("on"))$("#scrim").classList.remove("on")}
$("#scrim").onclick=function(){closeDrawer();closeSheet()};
$("#hamb").onclick=openDrawer;$("#dict").onclick=function(){openSheet("dict")};$("#me").onclick=function(){go("acc")};
$("#optbtn").onclick=function(){var o=$("#opts");o.classList.toggle("on");this.setAttribute("aria-expanded",o.classList.contains("on"))};
[].forEach.call(document.querySelectorAll(".chipsel"),function(g){g.onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(g.children,function(x){x.classList.remove("on")});b.classList.add("on");S[g.dataset.k]=b.dataset.v;closeDrawer();closeSheet();applyLook()}});
fillIcons();applyLook();renderPage();
</script>
</body></html>
